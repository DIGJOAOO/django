{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - PORTFOLIO CABRERA</title>
    <link rel="stylesheet" href="{% static 'background.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .blog { padding: 130px 20px 60px; max-width: 900px; margin: 0 auto; }
        .post {
            background-color: rgba(3, 16, 31, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .post h2 { color: #a8cfff; margin: 0 0 12px; }
        .post p { margin: 0; line-height: 1.6; white-space: pre-line; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark barra">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Cabrera Joao</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/blog/">Blog</a>
            </div>
        </div>
    </nav>

    <main class="contenido-principal">
        <section class="blog">
            <h1 class="mb-4">Blog</h1>
            {% for post in posts %}
                <article class="post">
                    <h2>{{ post.titulo }}</h2>
                    <p>{{ post.descripcion }}</p>
                </article>
            {% empty %}
                <p>Todavía no hay posts.</p>
            {% endfor %}
        </section>
    </main>

    <footer>
        <p>CONTACTO: jcabreragradin@alumno.huergo.edu.ar</p>
    </footer>
</body>
</html>
